version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tramites-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-supersecret}
      MYSQL_DATABASE: ${DB_NAME:-tramites_vehiculares}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: tramites-backend
    restart: always
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-supersecret}
      - DB_NAME=${DB_NAME:-tramites_vehiculares}
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: tramites-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
