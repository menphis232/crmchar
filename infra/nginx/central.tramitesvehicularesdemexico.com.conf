# Reverse proxy del host → contenedor frontend (puerto 8080)
# Instalar en el servidor: /etc/nginx/sites-available/central
# ln -sf /etc/nginx/sites-available/central /etc/nginx/sites-enabled/central

server {
    listen 80;
    server_name central.tramitesvehicularesdemexico.com;

    # Manifest con MIME correcto (Chrome exige application/manifest+json para PWA)
    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
