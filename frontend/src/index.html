<head>

  <meta name="description" content="Trámites vehiculares, gestores, autos seminuevos y tu panel en una sola app.">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="application-name" content="Trámites MX">

  <link rel="manifest" href="manifest.webmanifest" type="application/manifest+json">

  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
  <link rel="icon" href="favicon.ico" sizes="any">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Work+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Raleway:wght@400;600;700;800&family=Bebas+Neue&family=Anton&family=Merriweather:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Archivo+Black&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    async function cleanupLegacyPushWorkers() {
      if (!('serviceWorker' in navigator)) return;
      try {
        const legacy = await navigator.serviceWorker.getRegistration('/push/onesignal/');
        if (legacy) await legacy.unregister();
      } catch (e) {
        console.warn('[OneSignal] legacy SW cleanup:', e);
      }
    }

    async function prepareMergedServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      try {
        await cleanupLegacyPushWorkers();
        const workerPath = '/ngsw-worker.js';
        const scope = '/';
        const existing = await navigator.serviceWorker.getRegistration(scope);
        if (!existing) {
          await navigator.serviceWorker.register(workerPath, { scope });
        }
        await navigator.serviceWorker.ready;
      } catch (e) {
        console.warn('[OneSignal] prepare SW:', e);
      }
    }

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      if (window.__onesignalInitDone) return;
      try {
        await prepareMergedServiceWorker();
        await OneSignal.init({
          appId: '82f642c1-68c5-4067-b0c5-52384f8ecf4f',
          serviceWorkerPath: 'ngsw-worker.js',
          serviceWorkerParam: { scope: '/' },
          notifyButton: { enable: false },
          autoResubscribe: true,
          promptOptions: {
            slidedown: {
              prompts: [{
                type: 'push',
                autoPrompt: false,
                text: {
                  actionMessage: 'Recibe avisos de trámites y mensajes importantes en tu teléfono.',
                  acceptButton: 'Activar',
                  cancelButton: 'Ahora no',
                },
              }],
            },
          },
        });
        window.__onesignalInitDone = true;
      } catch (e) {
        window.__onesignalInitError = e && e.message ? e.message : String(e);
        console.error('[OneSignal] init failed:', e);
      }
    });
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
