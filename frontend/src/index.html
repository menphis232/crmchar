<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Trámites Vehiculares de México</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Trámites vehiculares, gestores, autos seminuevos y tu panel en una sola app.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trámites MX">
  <meta name="application-name" content="Trámites MX">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-TileImage" content="assets/pwa/icon-144.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16x16.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/pwa/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="assets/pwa/splash-512.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&family=Work+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Raleway:wght@400;600;700;800&family=Bebas+Neue&family=Anton&family=Merriweather:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Archivo+Black&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      background: #000;
      color: #fff;
      min-height: 100%;
    }
    #tvm-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #tvm-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #tvm-splash img {
      width: min(72vw, 280px);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div id="tvm-splash" aria-hidden="true">
    <img src="assets/pwa/splash-512.png" alt="Trámites Vehiculares de México" />
  </div>
  <app-root></app-root>
  <script>
    (function () {
      function hideSplash() {
        var el = document.getElementById('tvm-splash');
        if (!el || el.classList.contains('is-hidden')) return;
        el.classList.add('is-hidden');
        setTimeout(function () { el.remove(); }, 400);
      }
      window.addEventListener('tvm-app-ready', hideSplash);
      // Seguridad: no dejar splash eterno si falla el bootstrap
      setTimeout(hideSplash, 8000);
    })();
  </script>
</body>
</html>
