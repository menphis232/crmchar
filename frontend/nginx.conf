map $http_user_agent $is_social_crawler {
    default 0;
    ~*facebookexternalhit 1;
    ~*facebot 1;
    ~*whatsapp 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*slackbot 1;
    ~*telegrambot 1;
    ~*discordbot 1;
    ~*pinterest 1;
    ~*embedly 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker: necesario para proxy_pass con variables (OG por crawler)
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # index.html siempre fresco (evita referencias a chunks viejos tras deploy)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # PWA: manifest + service worker (sin cache agresivo)
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /OneSignalSDKWorker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        try_files $uri =404;
    }
    location = /OneSignalSDKUpdaterWorker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        try_files $uri =404;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ^~ /push/onesignal/ {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/push/onesignal/" always;
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }
    location ^~ /ngsw- {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Bundles de entrada: no cachear (apuntan a lazy chunks del build actual)
    location ~* ^/(main|polyfills|styles)-[A-Za-z0-9]+\.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Lazy chunks con hash: cache largo e inmutable
    location ~* ^/chunk-[A-Za-z0-9]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Uploads del backend (antes del regex de estáticos; si no, .png/.jpg devuelven 404)
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /og/ {
        proxy_pass http://backend:3000/og/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Rutas SPA post-pago Stripe (fallback explícito)
    location ^~ /subscription/ {
        try_files $uri /index.html;
    }
    location = /registro-pendiente {
        try_files /index.html =404;
    }

    # /autos: crawlers reciben HTML con Open Graph; usuarios el SPA
    location = /autos {
        error_page 418 = /__autos_og;
        if ($is_social_crawler) {
            return 418;
        }
        try_files /index.html =404;
    }
    location = /__autos_og {
        internal;
        proxy_pass http://backend:3000/api/share/catalog/autos;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Resto de estáticos: 404 real si no existen (no devolver index.html como .js)
    location ~* \.(js|css|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Páginas de detalle con URL canónica: crawlers reciben Open Graph; usuarios el SPA.
    # Así el mismo enlace bonito (/gestores/slug) muestra vista previa al compartirlo.
    location ~ ^/gestores/(?<og_gestor_slug>.+)$ {
        error_page 418 = @og_gestor;
        if ($is_social_crawler) {
            return 418;
        }
        try_files /index.html =404;
    }
    location @og_gestor {
        proxy_pass http://backend:3000/api/share/gestores/$og_gestor_slug;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/concesionarias/(?<og_dealer_slug>.+)$ {
        error_page 418 = @og_dealer;
        if ($is_social_crawler) {
            return 418;
        }
        try_files /index.html =404;
    }
    location @og_dealer {
        proxy_pass http://backend:3000/api/share/concesionarias/$og_dealer_slug;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/autos/(?<og_auto_id>[0-9a-fA-F-]+)$ {
        error_page 418 = @og_auto;
        if ($is_social_crawler) {
            return 418;
        }
        try_files /index.html =404;
    }
    location @og_auto {
        proxy_pass http://backend:3000/api/share/autos/$og_auto_id;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # URLs cortas para compartir con OG tags → backend las maneja y redirige al SPA
    location ~ ^/s/([0-9a-fA-F-]+)$ {
        proxy_pass http://backend:3000/s/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/sg/(.+)$ {
        proxy_pass http://backend:3000/sg/gestores/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/sc/(.+)$ {
        proxy_pass http://backend:3000/sc/concesionarias/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
