<header class="bar">
  <a class="logo" routerLink="/home" aria-label="Shakky home">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 4c1.2 3.4 4.6 4.6 4.6 4.6s-1.7 1.1-2.3 3.4c3.4-.6 5.7 1.7 5.7 1.7s-3.4.6-4.6 3.4c2.3 1.1 3.4 4 2.3 6.3-1.1 2.9-4.6 4.6-9.1 4.6S4.6 26.3 3.4 23.4C2.3 21.1 3.4 18.3 5.7 17.1 4.6 14.3 4 13.1 0.6 13.7c0 0 2.3-2.3 5.7-1.7-.6-2.3-2.3-3.4-2.3-3.4S7.8 7.4 8.9 4c.6 1.1 1.7 2.3 3.4 3.4 1.7-1.1 2.9-2.3 3.7-3.4z" fill="currentColor"/>
    </svg>
    Shakky
  </a>

  <nav class="nav" [class.is-open]="ui.menuOpen()" aria-label="Primary">
    <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="ui.menuOpen.set(false)">Home</a>
    <a routerLink="/shakes" routerLinkActive="is-active" (click)="ui.menuOpen.set(false)">Our Shakes</a>
    <a routerLink="/about" routerLinkActive="is-active" (click)="ui.menuOpen.set(false)">About Us</a>
    <a routerLink="/contact" routerLinkActive="is-active" (click)="ui.menuOpen.set(false)">Contact</a>
  </nav>

  <div class="tools">
    <button type="button" class="icon" aria-label="Search shakes" (click)="ui.searchOpen.set(true)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 16.5 20 20.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="icon" aria-label="Open cart" (click)="ui.openCart()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 11H7L6 8z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 8V7a3 3 0 0 1 6 0v1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      @if (cart.count() > 0) {
        <span class="badge">{{ cart.count() }}</span>
      }
    </button>
    <a class="franchise" routerLink="/contact" fragment="franchise">Franchise Program</a>
    <button type="button" class="burger" aria-label="Open menu" (click)="ui.menuOpen.set(!ui.menuOpen())">
      <span></span><span></span>
    </button>
  </div>
</header>
